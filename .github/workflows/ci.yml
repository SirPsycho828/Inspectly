name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  portal:
    name: Portal - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Provide non-secret placeholder Firebase web config for the build.
      # NEXT_PUBLIC_* values ship in the client bundle and are non-secret by
      # design; security comes from Firebase Security Rules, not from hiding
      # them. Sourced from the committed .env.example so no values are inlined
      # in this workflow. The build only needs them present to compile.
      - name: Prepare build env
        run: cp .env.example .env

      - name: Build
        run: npm run build
