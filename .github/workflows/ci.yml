name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  portal:
    name: Portal - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Build
        run: npm run build
        # These are dummy placeholder values, not real credentials. All
        # NEXT_PUBLIC_* Firebase web config is non-secret by design (it ships
        # in the client bundle); security comes from Firebase Security Rules,
        # not from hiding these. They exist only so the CI build can compile.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000:web:000'
